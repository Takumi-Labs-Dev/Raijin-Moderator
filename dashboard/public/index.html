<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>雷 ¦ Raijin — Overview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h1>雷 ¦ Raijin</h1>
      <p>// Takumi Labs v1.0</p>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">Navigation</div>
      <a href="/" class="nav-item active">
        <span class="nav-icon">⬡</span> Overview
      </a>
      <a href="/cases" class="nav-item">
        <span class="nav-icon">◈</span> Case Log
      </a>
      <a href="/warnings" class="nav-item">
        <span class="nav-icon">⚠</span> Warnings
      </a>
      <a href="/logs" class="nav-item">
        <span class="nav-icon">≡</span> Server Logs
      </a>
      <a href="/stats" class="nav-item">
        <span class="nav-icon">◎</span> Statistics
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-status">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">CHECKING...</span>
      </div>
      <a href="/logout" class="btn-logout">⏻ Logout</a>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-content">
    <div class="topbar">
      <div class="topbar-title"><span>Overview</span> — Dashboard</div>
      <div class="topbar-meta" id="lastUpdated">--</div>
    </div>

    <div class="page-body">

      <!-- STAT CARDS -->
      <div class="section-header">
        <h2>Action Totals</h2>
        <div class="section-divider"></div>
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Bans</div>
          <div class="stat-value ban" id="countBan">—</div>
          <div class="stat-icon">🔨</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Kicks</div>
          <div class="stat-value kick" id="countKick">—</div>
          <div class="stat-icon">👢</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Mutes</div>
          <div class="stat-value mute" id="countMute">—</div>
          <div class="stat-icon">🔇</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Warns</div>
          <div class="stat-value warn" id="countWarn">—</div>
          <div class="stat-icon">⚠</div>
        </div>
      </div>

      <!-- CHART + FEED ROW -->
      <div style="display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start;">

        <!-- TIMELINE CHART -->
        <div class="card">
          <div class="card-title">Moderation Activity — Timeline</div>
          <div class="chart-wrap">
            <canvas id="timelineChart"></canvas>
          </div>
        </div>

        <!-- RECENT FEED -->
        <div class="card">
          <div class="card-title">Recent Actions</div>
          <div id="recentFeed">
            <div class="empty-state"><p>Loading...</p></div>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>

<script>
  let timelineChart = null;

  function formatTime(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short' })
      + ' ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  }

  function badgeClass(type) {
    if (type === 'ban')           return 'ban';
    if (type === 'kick')          return 'kick';
    if (type === 'mute')          return 'mute';
    if (type === 'warn')          return 'warn';
    if (type === 'unmute')        return 'log';
    if (type === 'clearwarnings') return 'log';
    return 'log';
  }

  function renderFeed(items) {
    const feed = document.getElementById('recentFeed');
    if (!items || items.length === 0) {
      feed.innerHTML = '<div class="empty-state"><p>No actions yet</p></div>';
      return;
    }
    feed.innerHTML = items.map(c => `
      <div class="feed-item">
        <div class="feed-dot ${badgeClass(c.type)}"></div>
        <div class="feed-content">
          <div class="feed-main">
            <strong>${c.username}</strong>
            &mdash;
            <span class="badge badge-${badgeClass(c.type)}">${c.type}</span>
          </div>
          <div class="feed-time">${formatTime(c.timestamp)} &middot; by ${c.moderatorName}</div>
        </div>
      </div>
    `).join('');
  }

  function renderChart(timeline) {
    const ctx = document.getElementById('timelineChart').getContext('2d');
    const labels = timeline.map(t => t.date);
    const data   = timeline.map(t => t.count);

    if (timelineChart) timelineChart.destroy();

    timelineChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Actions',
          data,
          borderColor: '#CC0000',
          backgroundColor: 'rgba(204,0,0,0.08)',
          borderWidth: 2,
          pointBackgroundColor: '#CC0000',
          pointRadius: 4,
          pointHoverRadius: 6,
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false }
        },
        scales: {
          x: {
            ticks: { color: '#555570', font: { family: 'Share Tech Mono', size: 10 } },
            grid:  { color: 'rgba(255,255,255,0.03)' }
          },
          y: {
            ticks: { color: '#555570', font: { family: 'Share Tech Mono', size: 10 }, stepSize: 1 },
            grid:  { color: 'rgba(255,255,255,0.03)' },
            beginAtZero: true
          }
        }
      }
    });
  }

  async function loadData() {
    try {
      const res  = await fetch('/api/overview');
      const data = await res.json();

      document.getElementById('countBan').textContent  = data.counts.ban  || 0;
      document.getElementById('countKick').textContent = data.counts.kick || 0;
      document.getElementById('countMute').textContent = data.counts.mute || 0;
      document.getElementById('countWarn').textContent = data.counts.warn || 0;

      renderFeed(data.recent);
      renderChart(data.timeline);

      // Bot status — if we got data, the files are readable = operational
      document.getElementById('statusDot').classList.remove('offline');
      document.getElementById('statusText').textContent = 'RAIJIN ONLINE';
      document.getElementById('lastUpdated').textContent =
        'Updated ' + new Date().toLocaleTimeString('en-GB');

    } catch (err) {
      document.getElementById('statusDot').classList.add('offline');
      document.getElementById('statusText').textContent = 'DATA ERROR';
    }
  }

  // Load immediately, then refresh every 30 seconds
  loadData();
  setInterval(loadData, 30000);
</script>
</body>
</html>
